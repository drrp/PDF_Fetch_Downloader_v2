<!doctype html>
<html lang="te">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>తెలుగు సంప్రదాయ వ్యాకరణ అధ్యయనం - AI రీసెర్చ్ హబ్</title>
  <link rel="icon" type="image/png" href="https://auchithyam.com/images/LOGO.jpg" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="icon" type="image/png" href="https://auchithyam.com/images/LOGO.jpg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Mandali&family=Ramabhadra&family=Suranna&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #8d4204;
      color: #334155;
    }

    .telugu-title {
      font-family: "Suranna", serif;
    }

    .telugu-body {
      font-family: "Mandali", sans-serif;
    }

    .dashboard-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      color: white;
      padding: 25px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard-card {
      background: white;
      border-radius: 16px;
      border: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 25px;
    }

    .ai-formatted-content {
      font-family: "Mandali", sans-serif;
      text-align: justify;
      line-height: 1.8;
      font-size: 22px;
      color: #1e293b;
      font-weight: 400;
    }

    .ai-formatted-content h3 {
      font-family: "Ramabhadra", sans-serif;
      color: #15803d;
      font-size: 1.3rem;
      font-weight: 400;
      margin-top: 1.2rem;
      border-bottom: 2px solid #dcfce7;
      padding-bottom: 4px;
    }

    .ai-formatted-content strong {
      font-family: "Ramabhadra", sans-serif;
      color: #b91c1c;
      font-weight: 400;
    }

    .modal-content {
      font-family: "Mandali", sans-serif;
    }

    .form-select,
    .form-control {
      font-family: "Mandali", sans-serif;
      font-size: 17px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div class="container my-4">
    <!-- హెడర్ -->
    <div class="dashboard-header">
      <div>
        <h2 class="fw-bold mb-1 telugu-title" style="font-size: 28px">
          <i class="fa-solid fa-book-open-reader me-2"></i> తెలుగు సంప్రదాయ
          వ్యాకరణ అధ్యయనం
        </h2>
        <p class="mb-0 text-white-50 telugu-title" style="font-size: 18px">
          బాల- ప్రౌఢవ్యాకరణాలు & రీసెర్చ్ హబ్
        </p>
      </div>
      <div class="d-flex gap-2">
        <div id="adminToolsBtnContainer"></div>
        <a href="/" class="btn btn-light fw-bold px-3 shadow-sm telugu-title" style="color: #1e3a8a; font-size: 16px">
          <i class="fa-solid fa-house me-1"></i> హోమ్‌పేజీ
        </a>
      </div>
    </div>

    <!-- మెయిన్ సెర్చ్ కార్డ్ -->
    <div class="dashboard-card p-4">
      <h4 class="fw-bold mb-3 telugu-title" style="color: #1e3a8a; font-size: 22px">
        <i class="fa-solid fa-magnifying-glass me-2"></i>వెతకండి
      </h4>

      <div class="input-group mb-4 shadow-sm">
        <input type="text" id="advancedQuery" class="form-control form-control-lg telugu-body" style="font-size: 18px"
          placeholder="ప్రశ్న లేదా పదం టైప్ చేయండి (ఉదా: యడాగమ సంధి రూపాలు)..." />
        <button class="btn btn-primary px-4 fw-bold telugu-title" style="font-size: 18px" type="button"
          onclick="runAdvancedSearch()">
          <i class="fa-solid fa-search me-1"></i> శోధించు
        </button>
      </div>

      <div id="book-checkboxes" style="
            margin-top: 10px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            font-family: &quot;Mandali&quot;, sans-serif;
          ">
        <!-- ఏపీఐ నుండి ఇక్కడ చెక్‌బాక్స్‌లు డైనమిక్ గా వస్తాయి -->
      </div>

      <div id="aiSummaryCard" class="card mb-4 shadow-sm border-success bg-white rounded-4"
        style="display: none; margin-top: 20px">
        <div class="card-header bg-success text-white fw-bold py-3 rounded-top-4 telugu-title" style="font-size: 20px">
          విశ్లేషణాత్మక ఫలితాలు
        </div>
        <div class="card-body p-4">
          <div id="aiSummaryText" class="ai-formatted-content"></div>
        </div>
      </div>

      <div id="advancedResults" class="row mt-4"></div>
    </div>
  </div>

  <!-- అడ్మిన్ మోడల్ -->
  <div class="modal fade" id="adminToolsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-header bg-dark text-white rounded-top-4">
          <h5 class="modal-title fw-bold telugu-title" style="font-size: 22px">
            <i class="fa-solid fa-gear me-2"></i> ప్రత్యేక OCR & టెక్స్ట్
            ఎడిట్ నిర్వహణ ప్యానెల్
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 bg-light">
          <ul class="nav nav-tabs mb-4" id="adminTab" role="tablist">
            <li class="nav-item">
              <a class="nav-link active fw-bold telugu-title" style="font-size: 17px" id="ocr-tab" data-bs-toggle="tab"
                href="#ocrPanel" role="tab" onclick="loadDownloadedBooksForOCR('downloadedFilesSelect')">
                <i class="fa-solid fa-bolt me-1 text-success"></i> కొత్త
                పుస్తకానికి OCR చేయండి
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold telugu-title" style="font-size: 17px" id="edit-tab" data-bs-toggle="tab"
                href="#editPanel" role="tab" onclick="loadDownloadedBooksForOCR('editFilesSelect')">
                <i class="fa-solid fa-pen-to-square me-1 text-primary"></i>
                టెక్స్ట్ సరిదిద్దండి (Edit)
              </a>
            </li>
          </ul>

          <div class="tab-content" id="adminTabContent">
            <div class="tab-pane fade show active" id="ocrPanel" role="tabpanel">
              <!-- నూతన OCR కంట్రోల్స్ ఇక్కడ చేర్చబడ్డాయి -->
              <div class="border p-3 rounded bg-white shadow-sm mb-3">
                <label class="form-label fw-bold telugu-body" style="font-size: 17px">OCR రన్ చేయవలసిన ఫైల్‌ను
                  ఎంచుకోండి:</label>
                <select id="downloadedFilesSelect" class="form-select form-select-lg telugu-body mb-3">
                  <option value="">-- పుస్తకాన్ని ఎంచుకోండి --</option>
                </select>

                <label class="form-label fw-bold telugu-body" style="font-size: 17px">OCR విధానం:</label>
                <select id="ocrMode" class="form-select telugu-body mb-3" onchange="togglePageInputs()">
                  <option value="full">పూర్తి పుస్తకం (Full PDF)</option>
                  <option value="range">పేజీల శ్రేణి (Page Range)</option>
                </select>

                <div id="pageRangeInputs" class="row mb-3" style="display: none">
                  <div class="col-6">
                    <input type="number" id="ocrStartPage" class="form-control" placeholder="ప్రారంభ పేజీ (ఉదా: 1)" />
                  </div>
                  <div class="col-6">
                    <input type="number" id="ocrEndPage" class="form-control" placeholder="చివరి పేజీ (ఉదా: 10)" />
                  </div>
                </div>

                <button class="btn btn-success px-4 py-2 fw-bold telugu-title w-100" style="font-size: 18px"
                  type="button" onclick="triggerManualOCR()">
                  <i class="fa-solid fa-play me-2"></i> OCR ప్రారంభించు
                </button>
              </div>

              <div id="ocrStatus" class="fw-bold mt-3 telugu-body text-center" style="font-size: 17px"></div>
            </div>

            <div class="tab-pane fade" id="editPanel" role="tabpanel">
              <p class="text-muted mb-3 telugu-body" style="font-size: 17px">
                సవరించాల్సిన పుస్తకం మరియు పేజీ నంబర్:
              </p>
              <div class="row g-2 mb-3">
                <div class="col-md-7">
                  <select id="editFilesSelect" class="form-select form-select-lg telugu-body">
                    <option value="">-- పుస్తకాన్ని ఎంచుకోండి --</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <input type="number" id="editPageNumber" class="form-control form-control-lg telugu-body"
                    placeholder="పేజీ నంబర్" />
                </div>
                <div class="col-md-2">
                  <button class="btn btn-dark btn-lg w-100 fw-bold telugu-title" style="font-size: 17px"
                    onclick="fetchOCRText()">
                    టెక్స్ట్ తెవ్వు
                  </button>
                </div>
              </div>

              <div id="editStatus" class="fw-bold mt-2 mb-2 telugu-body"></div>

              <div id="textAreaContainer" style="display: none">
                <textarea id="ocrTextArea" class="form-control mb-3 shadow-sm telugu-body" rows="10"
                  style="font-size: 18px; line-height: 1.8"></textarea>
                <button class="btn btn-success px-4 py-2 fw-bold telugu-title" style="font-size: 17px"
                  onclick="saveOCRText()">
                  <i class="fa-solid fa-floppy-disk me-2"></i> సేవ్ చేయి
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      checkAdminAccess();
      loadIndexedBooks(); // పేజీ లోడ్ అయిన వెంటనే బుక్స్ చెక్‌బాక్స్‌లు తీసుకురావడానికి
    });

    async function checkAdminAccess() {
      try {
        const res = await fetch("/api/current-user");
        const data = await res.json();
        if (data.logged_in && data.is_admin) {
          document.getElementById("adminToolsBtnContainer").innerHTML = `
              <button class="btn btn-warning fw-bold px-3 shadow-sm text-dark telugu-title" style="font-size: 16px;" data-bs-toggle="modal" data-bs-target="#adminToolsModal">
                <i class="fa-solid fa-gears me-1"></i> టూల్స్
              </button>
            `;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadIndexedBooks() {
      try {
        const response = await fetch("/get-indexed-books");
        const data = await response.json();
        const container = document.getElementById("book-checkboxes");
        if (container && data.status === "success" && data.books.length > 0) {
          container.innerHTML = "";
          data.books.forEach((book) => {
            // 🌟 .pdf లేదా .PDF ఎక్స్‌టెన్షన్‌ను తొలగించడానికి (Regex వాడకం)
            let cleanBookName = book.replace(/\.[^/.]+$/, "");

            const label = document.createElement("label");
            label.style.cursor = "pointer";
            label.className = "telugu-body d-flex align-items-center gap-1";
            label.innerHTML = `<input type="checkbox" name="selected_books" value="${book}" checked> <span class="badge bg-secondary">${cleanBookName}</span>`;
            container.appendChild(label);
          });
        }
      } catch (e) {
        console.error("Error loading books:", e);
      }
    }

    async function loadDownloadedBooksForOCR(selectId) {
      const select = document.getElementById(selectId);
      select.innerHTML =
        "<option value=''>ఫైళ్లను లోడ్ చేస్తోంది...</option>";
      try {
        const res = await fetch("/list-downloaded-books");
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          select.innerHTML =
            "<option value=''>-- పుస్తకాన్ని ఎంచుకోండి --</option>";
          data.files.forEach((f) => {
            let opt = document.createElement("option");
            let filename = typeof f === "object" ? f.filename : f;
            let isOcrDone = typeof f === "object" ? f.ocr_done : false;
            opt.value = filename;
            opt.className = "telugu-body";
            let statusIcon = isOcrDone
              ? "✅ [పూర్తయింది] - "
              : "⏳ [చేయాలి] - ";
            opt.style.color = isOcrDone ? "#28a745" : "#dc3545";
            opt.textContent = statusIcon + filename;
            select.appendChild(opt);
          });
        } else {
          select.innerHTML = "<option value=''>ఫైల్స్ లేవు.</option>";
        }
      } catch (err) {
        select.innerHTML = "<option value=''>లోపం ఏర్పడింది.</option>";
      }
    }

    // కొత్తగా చేర్చిన పేజీ రేంజ్ టోగుల్ ఫంక్షన్
    function togglePageInputs() {
      const mode = document.getElementById("ocrMode").value;
      document.getElementById("pageRangeInputs").style.display =
        mode === "range" ? "flex" : "none";
    }

    // అప్‌డేట్ చేసిన OCR ప్రారంభించు ఫంక్షన్ (SweetAlert2 తో)
    async function triggerManualOCR() {
      const filename = document.getElementById("downloadedFilesSelect").value;
      const mode = document.getElementById("ocrMode").value;

      if (!filename) {
        Swal.fire(
          "గమనిక",
          "దయచేసి ముందుగా ఒక పుస్తకాన్ని ఎంచుకోండి.",
          "warning",
        );
        return;
      }

      let apiUrl = `/run-special-ocr?filename=${encodeURIComponent(filename)}`;

      if (mode === "range") {
        const startPage = document.getElementById("ocrStartPage").value;
        const endPage = document.getElementById("ocrEndPage").value;
        if (
          !startPage ||
          !endPage ||
          parseInt(startPage) > parseInt(endPage) ||
          parseInt(startPage) < 1
        ) {
          Swal.fire(
            "లోపం",
            "దయచేసి సరైన ప్రారంభ మరియు చివరి పేజీ నంబర్లను నమోదు చేయండి.",
            "error",
          );
          return;
        }
        apiUrl += `&start_page=${startPage}&end_page=${endPage}`;
      }

      // 🌟 SweetAlert లోడింగ్ యానిమేషన్
      Swal.fire({
        title: "OCR ప్రాసెసింగ్ జరుగుతోంది...",
        html: "పుస్తకంలోని పేజీలు స్కాన్ అవుతున్నాయి.<br>దీనికి కొద్ది నిమిషాలు పట్టవచ్చు. దయచేసి వేచి ఉండండి...",
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: () => {
          Swal.showLoading();
        },
      });

      try {
        const response = await fetch(apiUrl, { method: "POST" });
        const data = await response.json();

        if (data.status === "success") {
          // 🌟 విజయవంతమైనప్పుడు SweetAlert
          Swal.fire({
            icon: "success",
            title: "పూర్తయింది!",
            text: data.message,
            confirmButtonText: "సరే",
            confirmButtonColor: "#28a745",
          });
          loadDownloadedBooksForOCR("downloadedFilesSelect");
          loadIndexedBooks();
        } else {
          // 🌟 ఎర్రర్ వచ్చినప్పుడు SweetAlert
          Swal.fire("ఎర్రర్", data.message, "error");
        }
      } catch (error) {
        Swal.fire(
          "సాంకేతిక లోపం",
          "సర్వర్ వద్ద అనుకోని లోపం ఏర్పడింది. దయచేసి మళ్లీ ప్రయత్నించండి.",
          "error",
        );
      }
    }

    async function fetchOCRText() {
      const filename = document.getElementById("editFilesSelect").value;
      const pageNum = document.getElementById("editPageNumber").value;
      const statusDiv = document.getElementById("editStatus");
      const container = document.getElementById("textAreaContainer");

      if (!filename || !pageNum) {
        alert("పుస్తకం మరియు పేజీ నంబర్ ఎంచుకోండి.");
        return;
      }
      statusDiv.innerHTML =
        "<span class='text-info'>టెక్స్ట్ తెస్తోంది...</span>";
      container.style.display = "none";

      try {
        const res = await fetch(
          `/get-ocr-text?filename=${encodeURIComponent(filename)}&page_number=${pageNum}`,
        );
        const data = await res.json();
        if (data.status === "success") {
          document.getElementById("ocrTextArea").value = data.text;
          container.style.display = "block";
          statusDiv.innerHTML = "";
        } else {
          statusDiv.innerHTML = `<span class='text-danger'>${data.message}</span>`;
        }
      } catch (e) {
        statusDiv.innerHTML = `<span class='text-danger'>లోపం.</span>`;
      }
    }

    async function saveOCRText() {
      const filename = document.getElementById("editFilesSelect").value;
      const pageNum = document.getElementById("editPageNumber").value;
      const newText = document.getElementById("ocrTextArea").value;
      const statusDiv = document.getElementById("editStatus");

      let formData = new FormData();
      formData.append("filename", filename);
      formData.append("page_number", pageNum);
      formData.append("new_text", newText);

      try {
        statusDiv.innerHTML =
          "<span class='text-info'>సేవ్ అవుతోంది...</span>";
        const res = await fetch("/update-ocr-text", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (data.status === "success") {
          statusDiv.innerHTML = `<span class='text-success'>✅ ${data.message}</span>`;
        } else {
          statusDiv.innerHTML = `<span class='text-danger'>${data.message}</span>`;
        }
      } catch (e) {
        statusDiv.innerHTML = `<span class='text-danger'>లోపం.</span>`;
      }
    }

    async function runAdvancedSearch() {
      const query = document.getElementById("advancedQuery").value.trim();
      const resultsDiv = document.getElementById("advancedResults");
      const summaryCard = document.getElementById("aiSummaryCard");
      const summaryText = document.getElementById("aiSummaryText");

      // చెక్‌బాక్స్‌లలో సెలెక్ట్ చేసిన పుస్తకాల పేర్లను కనుక్కోవడం
      const selectedBooks = Array.from(
        document.querySelectorAll('input[name="selected_books"]:checked'),
      )
        .map((cb) => cb.value)
        .join(",");

      if (!query) return alert("ప్రశ్న టైప్ చేయండి.");
      resultsDiv.innerHTML =
        "<p class='text-primary p-3 telugu-body fw-bold fs-5'><i class='fa-solid fa-spinner fa-spin me-2'></i>శోధిస్తోంది...</p>";
      summaryCard.style.display = "none";

      let apiUrl = `/search-pdf-highlight?query=${encodeURIComponent(query)}`;
      if (selectedBooks) {
        apiUrl += `&books=${encodeURIComponent(selectedBooks)}`;
      }

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        // 1. AI సారాంశాన్ని చూపించడం
        if (data.ai_summary) {
          summaryText.innerHTML = marked.parse(data.ai_summary);
          summaryCard.style.display = "block";
        }
