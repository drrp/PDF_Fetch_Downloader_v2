# Render Blueprint for the Telugu Digital Library Hub (PDF_Fetch_Downloader_v2)
# Deploys the FastAPI backend, which also serves the frontend, as one web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pdf-fetch-downloader
    runtime: python
    plan: free             # free tier: no card needed, but the service sleeps after ~15 min idle and has no persistent disk
    region: singapore      # closest Render region to India
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # --proxy-headers / --forwarded-allow-ips make uvicorn trust Render's HTTPS
    # headers, so Google OAuth builds an https:// redirect URL (required for a
    # custom domain such as library.auchithyam.com).
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    autoDeploy: true
    # Custom domain. Add the CNAME at your DNS provider, then Render issues the
    # certificate automatically. Delete this block if you deploy without one.
    domains:
      - library.auchithyam.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # --- Secrets: set these in the Render dashboard (sync: false keeps them out of git) ---
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # --- Render generates a strong session key for you ---
      - key: SESSION_SECRET_KEY
        generateValue: true
      # --- Plain config ---
      - key: ADMIN_EMAIL
        value: rpsarma9247@gmail.com
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: COOKIE_HTTPS_ONLY
        value: "true"
      # Internal URL of the Chandam API service declared below (no scheme; the app
      # prepends http://). Delete this if you don't want chandassu analysis.
      - key: CHANDAM_API_URL
        fromService:
          type: web
          name: chandam-api
          property: hostport
    # Persistent disk so downloaded PDFs survive restarts. This needs a paid
    # instance AND a payment method on file, so it is commented out for the free
    # tier. To enable it: set plan back to 'starter' above and uncomment this block.
    # disk:
    #   name: downloads
    #   mountPath: /opt/render/project/src/downloads
    #   sizeGB: 1

  # Chandam (ఛందస్సు) API - identifies the metre of a Telugu verse.
  # Public image from the project: https://github.com/miriyald/chandam
  - type: web
    name: chandam-api
    runtime: image
    image:
      url: ghcr.io/miriyald/chandam-api:latest
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # The image listens on 8080 by default; Render routes traffic to PORT (10000),
      # so point ASP.NET at that port.
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: CHANDAM_RULESET
        value: default
